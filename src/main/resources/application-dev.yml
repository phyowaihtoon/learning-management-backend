spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/creatip_lms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:admin@123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 1800000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# ===================================================================
# CREATIP specific properties
# ===================================================================
creatip:
  security:
    authentication:
      jwt:
        # This token must be encoded using Base64 and be at least 256 bits long (you can type `openssl rand -base64 64` on your command line to generate a 512 bits one)
        base64-secret: ZmY1YWU2MzIwYzI4MjY2ZGIyNWYxMTkyNDc4ZTk2ODgxYzBkYWEyYjYzMzAzMDQ5Y2ExNjRkN2MwYTk4YzAyM2E0YjQ0MmRkOGIxNGI5NTIxYjY2ZTk4M2E1ZDgxYTlmODFiZGMyNDYyMTA4OGM2NDk5ZTk3OTZhNDk3NzUwMDk=
        # Token is valid 24 hours
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 2592000